<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipova Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #07070c;
  --card:    #0d0d16;
  --card-h:  #12121e;
  --border:  rgba(255,255,255,0.06);
  --border-h:rgba(59,91,255,0.5);
  --text:    #eeeef5;
  --muted:   #52526e;
  --sub:     #8484a8;
  --accent:  #3b5bff;
  --accent-h:#5b7bff;
  --r: 14px;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Lexend', sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* noise grain overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.35;
  z-index: 0;
}

/* top glow */
body::before {
  content: '';
  position: fixed;
  top: -180px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 500px;
  background: radial-gradient(ellipse, rgba(59,91,255,0.13) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 56px 24px 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Logo ── */
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 20px;
  animation: fadeUp 0.5s ease both;
}

.logo-icon {
  width: 42px; height: 42px;
  background: var(--accent);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 28px rgba(59,91,255,0.35);
}

.logo-text { line-height: 1.15; }

.logo-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text);
  display: block;
}

.logo-sub {
  font-size: 12px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: block;
}

/* ── Tagline ── */
.tagline {
  font-size: 14px;
  font-weight: 300;
  color: var(--sub);
  text-align: center;
  line-height: 1.7;
  margin-bottom: 44px;
  max-width: 300px;
  animation: fadeUp 0.5s 0.08s ease both;
}

/* ── Links ── */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.link-item {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  text-decoration: none;
  color: var(--text);
  transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  animation: fadeUp 0.5s ease both;
}

.link-item:hover {
  background: var(--card-h);
  border-color: var(--border-h);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(59,91,255,0.12);
}

.link-item.hl {
  border-color: rgba(59,91,255,0.22);
  background: rgba(59,91,255,0.06);
}
.link-item.hl:hover {
  background: rgba(59,91,255,0.11);
  border-color: rgba(59,91,255,0.55);
  box-shadow: 0 8px 32px rgba(59,91,255,0.2);
}

.link-icon {
  width: 40px; height: 40px;
  flex-shrink: 0;
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: center;
  color: var(--sub);
}
.link-item.hl .link-icon {
  background: rgba(59,91,255,0.14);
  border-color: rgba(59,91,255,0.2);
  color: var(--accent-h);
}

.link-body { flex: 1; min-width: 0; }

.link-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link-desc {
  font-size: 12px;
  font-weight: 300;
  color: var(--muted);
  margin-top: 2px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link-arrow {
  color: var(--muted);
  font-size: 16px;
  flex-shrink: 0;
  transition: transform 0.18s, color 0.18s;
}
.link-item:hover .link-arrow {
  color: var(--sub);
  transform: translateX(3px);
}

/* ── Footer ── */
.foot {
  margin-top: 40px;
  font-size: 11px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-align: center;
  animation: fadeUp 0.5s 0.4s ease both;
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 520px) {
  .page { padding: 48px 18px 56px; }
}
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const ICONS = {
  foundation: `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>`,
  book:       `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c1.93-1.5 4.5-1.75 7-1.5v14c-2.5-.25-5.07 0-7 1.5m0-14C10.07 4.75 7.5 4.5 5 4.75v14c2.5-.25 5.07 0 7 1.5m0-14v14"/></svg>`,
  github:     `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`,
  sparkle:    `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>`,
  globe:      `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c-2.5 3-4 5.7-4 9s1.5 6 4 9M12 3c2.5 3 4 5.7 4 9s-1.5 6-4 9"/></svg>`,
};

function render(cfg) {
  const app = document.getElementById('app');

  const linksHtml = (cfg.links || []).map((l, i) => {
    const icon = ICONS[l.icon] || ICONS.globe;
    const delay = `animation-delay:${0.12 + i * 0.07}s`;
    const desc = l.description ? `<span class="link-desc">${l.description}</span>` : '';
    return `
      <a href="${l.url}" class="link-item${l.highlight ? ' hl' : ''}" target="_blank" rel="noopener" style="${delay}">
        <span class="link-icon">${icon}</span>
        <span class="link-body">
          <span class="link-label">${l.label}</span>
          ${desc}
        </span>
        <span class="link-arrow">→</span>
      </a>`;
  }).join('');

  const [first, ...rest] = (cfg.name || 'Flipova Developers').split(' ');

  app.innerHTML = `
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 48 48" fill="none">
          <path d="M24 9L35 31H13L24 9Z" fill="white"/>
          <rect x="13" y="33" width="22" height="7" rx="2.5" fill="white"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">${cfg.name || 'Flipova Developers'}</span>
        <span class="logo-sub">dev.flipova.fr</span>
      </div>
    </div>
    ${cfg.tagline ? `<p class="tagline">${cfg.tagline}</p>` : ''}
    <div class="links">${linksHtml}</div>
    <p class="foot">© ${new Date().getFullYear()} Flipova</p>
  `;

  document.title = cfg.name || 'Flipova Developers';
}

const FALLBACK = {
  name: 'Flipova Developers',
  tagline: 'Tous les outils pour construire avec Flipova',
  links: [
    { label: 'Foundation — Design System', description: 'Composants React Native, 9 thèmes, 23 layouts', url: 'https://dev.flipova.fr/foundation', icon: 'foundation', highlight: true },
    { label: 'Documentation',              description: 'Guides, API reference, exemples',               url: 'https://dev.flipova.fr',             icon: 'book'       },
    { label: 'GitHub',                     description: 'Code source, issues, contributions',            url: 'https://github.com/flipova/foundation', icon: 'github'  },
    { label: 'Flippa AI',                  description: 'Assistant IA pour développeurs — bêta',        url: 'https://flipova.fr/flippa',           icon: 'sparkle'    },
    { label: 'flipova.fr',                 description: 'Site principal',                                url: 'https://flipova.fr',                  icon: 'globe'      },
  ]
};

fetch('links.yaml')
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(t => render(jsyaml.load(t)))
  .catch(() => render(FALLBACK));
</script>
</body>
</html>
