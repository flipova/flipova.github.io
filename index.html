<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipova Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#08080e;
  --text:#ededf5;
  --muted:#4e4e6a;
  --sub:#9090b8;
  --accent:#3b5bff;
  --card-bg:#0e0e1c;
  --card-border:rgba(255,255,255,0.07);
  --card-border-hl:rgba(59,91,255,0.55);
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Lexend',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}

body::before{
  content:'';
  position:fixed;
  top:-200px;left:50%;
  transform:translateX(-50%);
  width:800px;height:600px;
  background:radial-gradient(ellipse,rgba(59,91,255,0.11) 0%,transparent 68%);
  pointer-events:none;
}

.scene{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  position:relative;
}

/* ── Header ── */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin-bottom:52px;
  animation:fadeUp .5s ease both;
}

.wordmark{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.03em;
  color:var(--text);
}

.wordmark span{
  color:var(--accent);
}

.tagline{
  font-size:13px;
  font-weight:300;
  color:var(--sub);
  letter-spacing:0.01em;
}

/* ── Carousel ── */
.carousel-wrap{
  position:relative;
  width:100vw;
  height:220px;
  perspective:1100px;
  perspective-origin:50% 50%;
}

.carousel-track{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
}

/* ── Card ── */
.card{
  position:absolute;
  top:50%;
  left:50%;
  width:300px;
  height:180px;
  border-radius:18px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  padding:28px 28px 24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  transition:transform .6s cubic-bezier(.25,.8,.25,1),
             opacity .6s cubic-bezier(.25,.8,.25,1),
             border-color .3s,
             box-shadow .3s;
  text-decoration:none;
  color:var(--text);
  transform-origin:center center;
  will-change:transform,opacity;
}

.card.active{
  border-color:var(--card-border-hl);
  box-shadow:0 0 40px rgba(59,91,255,0.18),0 20px 60px rgba(0,0,0,0.5);
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}

.card-icon{
  width:40px;height:40px;
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  color:var(--sub);
  flex-shrink:0;
}

.card.active .card-icon{
  background:rgba(59,91,255,0.14);
  border-color:rgba(59,91,255,0.25);
  color:#7a9fff;
}

.card-num{
  font-size:11px;
  font-weight:500;
  letter-spacing:0.08em;
  color:var(--muted);
}

.card-bottom{}

.card-label{
  font-size:17px;
  font-weight:600;
  letter-spacing:-0.02em;
  color:var(--text);
  margin-bottom:6px;
  line-height:1.25;
}

.card-desc{
  font-size:12px;
  font-weight:300;
  color:var(--sub);
  line-height:1.5;
}

/* ── Nav dots ── */
.dots{
  display:flex;
  gap:7px;
  margin-top:52px;
  animation:fadeUp .5s .2s ease both;
}

.dot{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--muted);
  transition:background .3s,transform .3s,width .3s;
  cursor:pointer;
}

.dot.active{
  background:var(--accent);
  width:18px;
  border-radius:3px;
}

/* ── Hint ── */
.hint{
  position:absolute;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:20px;
  animation:fadeUp .5s .35s ease both;
}

.hint-btn{
  width:38px;height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--sub);
  transition:background .2s,border-color .2s,color .2s;
  flex-shrink:0;
}

.hint-btn:hover{
  background:rgba(59,91,255,0.12);
  border-color:rgba(59,91,255,0.3);
  color:var(--text);
}

.open-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:10px 22px;
  font-family:'Lexend',sans-serif;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:background .2s,transform .2s,box-shadow .2s;
  letter-spacing:-0.01em;
}

.open-btn:hover{
  background:#5272ff;
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(59,91,255,0.35);
}

/* ── Animations ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

/* swipe indicator */
.swipe-hint{
  font-size:11px;
  font-weight:300;
  color:var(--muted);
  letter-spacing:0.05em;
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
}
</style>
</head>
<body>

<div class="scene">

  <div class="header">
    <div class="wordmark">Flipova <span>Developers</span></div>
    <div class="tagline" id="tagline">Tous les outils pour construire avec Flipova</div>
  </div>

  <div class="carousel-wrap">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="hint">
    <button class="hint-btn" id="prevBtn" aria-label="Précédent">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="open-btn" id="openBtn">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
      Ouvrir
    </button>
    <button class="hint-btn" id="nextBtn" aria-label="Suivant">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <p class="swipe-hint">glisser ou utiliser les touches ← →</p>
</div>

<script>
const ICONS = {
  foundation:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>`,
  book:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c1.93-1.5 4.5-1.75 7-1.5v14c-2.5-.25-5.07 0-7 1.5m0-14C10.07 4.75 7.5 4.5 5 4.75v14c2.5-.25 5.07 0 7 1.5m0-14v14"/></svg>`,
  github:`<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`,
  sparkle:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>`,
  globe:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c-2.5 3-4 5.7-4 9s1.5 6 4 9M12 3c2.5 3 4 5.7 4 9s-1.5 6-4 9"/></svg>`,
  terminal:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z"/></svg>`,
};

const FALLBACK = {
  name:'Flipova Developers',
  tagline:'Tous les outils pour construire avec Flipova',
  links:[
    {label:'Foundation',description:'Design system React Native — 9 thèmes, 23 layouts',url:'https://dev.flipova.fr/foundation',icon:'foundation'},
    {label:'Documentation',description:'Guides, API reference et exemples de code',url:'https://dev.flipova.fr',icon:'book'},
    {label:'GitHub',description:'Code source, issues et contributions',url:'https://github.com/flipova/foundation',icon:'github'},
    {label:'Flippa AI',description:'Assistant IA pour développeurs — bêta publique',url:'https://flipova.fr/flippa',icon:'sparkle'},
    {label:'flipova.fr',description:'Site principal Flipova',url:'https://flipova.fr',icon:'globe'},
  ]
};

let current = 0;
let links = [];
let isDragging = false;
let dragStartX = 0;
let dragDelta = 0;

function getPositionStyle(offset, total) {
  const w = Math.min(window.innerWidth * 0.7, 300);
  const gap = w * 0.85;
  const x = offset * gap - w / 2;
  const absOff = Math.abs(offset);

  const rotY = offset * -18;
  const z = offset === 0 ? 0 : -Math.abs(offset) * 90;
  const scale = offset === 0 ? 1 : Math.max(0.72, 1 - absOff * 0.14);
  const opacity = offset === 0 ? 1 : Math.max(0, 1 - absOff * 0.38);
  const visible = absOff <= 2;

  return {x, rotY, z, scale, opacity, visible};
}

function buildCards(data) {
  const track = document.getElementById('track');
  const dotsEl = document.getElementById('dots');
  links = data.links || [];
  track.innerHTML = '';
  dotsEl.innerHTML = '';

  const w = Math.min(window.innerWidth * 0.7, 300);

  links.forEach((l, i) => {
    const card = document.createElement('a');
    card.className = 'card' + (i === 0 ? ' active' : '');
    card.href = l.url;
    card.target = '_blank';
    card.rel = 'noopener';
    card.style.width = w + 'px';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-icon">${ICONS[l.icon]||ICONS.globe}</div>
        <span class="card-num">${String(i+1).padStart(2,'0')}</span>
      </div>
      <div class="card-bottom">
        <div class="card-label">${l.label}</div>
        <div class="card-desc">${l.description||''}</div>
      </div>`;

    card.addEventListener('click', e => {
      if (Math.abs(dragDelta) > 5) { e.preventDefault(); return; }
      if (i !== current) { e.preventDefault(); goTo(i); }
    });

    track.appendChild(card);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });

  updateLayout(false);
}

function updateLayout(animate = true) {
  const cards = document.querySelectorAll('.card');
  const dots = document.querySelectorAll('.dot');
  const w = Math.min(window.innerWidth * 0.7, 300);

  cards.forEach((card, i) => {
    const offset = i - current;
    const p = getPositionStyle(offset, links.length);
    card.style.width = w + 'px';
    card.style.transition = animate
      ? 'transform .6s cubic-bezier(.25,.8,.25,1), opacity .6s cubic-bezier(.25,.8,.25,1), border-color .3s, box-shadow .3s'
      : 'none';
    card.style.transform = `translate(calc(${p.x}px - 0px), -50%) rotateY(${p.rotY}deg) translateZ(${p.z}px) scale(${p.scale})`;
    card.style.opacity = p.visible ? p.opacity : 0;
    card.style.pointerEvents = i === current ? 'auto' : (Math.abs(offset) <= 1 ? 'auto' : 'none');
    card.classList.toggle('active', i === current);
  });

  dots.forEach((d, i) => d.classList.toggle('active', i === current));

  const btn = document.getElementById('openBtn');
  if (btn && links[current]) btn.onclick = () => window.open(links[current].url,'_blank');
}

function goTo(idx) {
  current = ((idx % links.length) + links.length) % links.length;
  updateLayout(true);
}

function init(cfg) {
  if (cfg.tagline) document.getElementById('tagline').textContent = cfg.tagline;
  if (cfg.name) document.title = cfg.name;
  buildCards(cfg);

  document.getElementById('prevBtn').onclick = () => goTo(current - 1);
  document.getElementById('nextBtn').onclick = () => goTo(current + 1);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  const wrap = document.querySelector('.carousel-wrap');

  wrap.addEventListener('pointerdown', e => {
    isDragging = true;
    dragStartX = e.clientX;
    dragDelta = 0;
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!isDragging) return;
    dragDelta = e.clientX - dragStartX;
  });

  wrap.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (dragDelta < -50) goTo(current + 1);
    else if (dragDelta > 50) goTo(current - 1);
    dragDelta = 0;
  });

  window.addEventListener('resize', () => updateLayout(false));
}

fetch('links.yaml')
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(t => init(jsyaml.load(t)))
  .catch(() => init(FALLBACK));
</script>
</body>
</html>
