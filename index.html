<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipova Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#060610;
  --text:#f0f0fa;
  --muted:#3a3a5a;
  --sub:#7070a0;
  --accent:#4060ff;
  --accent2:#7040ff;
  --glow:rgba(64,96,255,0.22);
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Lexend',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}

/* ── grid lines background ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(64,96,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(64,96,255,0.04) 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
}

/* ── top glow ── */
body::after{
  content:'';
  position:fixed;
  top:-260px;left:50%;transform:translateX(-50%);
  width:900px;height:600px;
  background:radial-gradient(ellipse,rgba(64,96,255,0.15) 0%,rgba(112,64,255,0.07) 40%,transparent 70%);
  pointer-events:none;
}

.scene{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;z-index:1;
}

/* ── Header ── */
.header{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-bottom:60px;
  animation:fadeUp .6s ease both;
}

.logo-row{
  display:flex;align-items:center;gap:10px;
}

.logo-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(64,96,255,0.1);
  border:1px solid rgba(64,96,255,0.25);
  border-radius:100px;
  padding:4px 14px 4px 10px;
}

.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent),0 0 16px rgba(64,96,255,0.5);
  animation:pulse 2.4s ease infinite;
}

@keyframes pulse{
  0%,100%{box-shadow:0 0 6px var(--accent),0 0 12px rgba(64,96,255,0.4)}
  50%{box-shadow:0 0 12px var(--accent),0 0 24px rgba(64,96,255,0.7)}
}

.logo-text{
  font-size:13px;font-weight:600;letter-spacing:0.04em;
  color:rgba(100,140,255,0.9);text-transform:uppercase;
}

.wordmark{
  font-size:34px;font-weight:700;letter-spacing:-0.04em;
  color:var(--text);line-height:1;
}

.wordmark em{
  font-style:normal;
  background:linear-gradient(135deg,#4060ff,#9060ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.tagline{
  font-size:13px;font-weight:300;color:var(--sub);
  letter-spacing:0.02em;
}

/* ── Carousel ── */
.carousel-wrap{
  position:relative;
  width:100vw;height:200px;
  perspective:1200px;
  perspective-origin:50% 50%;
}

.carousel-track{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
}

/* ── Card ── */
.card{
  position:absolute;
  top:50%;left:50%;
  width:290px;
  border-radius:20px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  padding:24px 24px 20px;
  cursor:pointer;
  text-decoration:none;
  color:var(--text);
  will-change:transform,opacity;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 60%);
  pointer-events:none;
}

.card.active{
  border-color:rgba(64,96,255,0.5);
  background:rgba(64,96,255,0.06);
}

.card.active::after{
  content:'';
  position:absolute;
  top:-1px;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(64,96,255,0.8),transparent);
}

/* card scan line animation on active */
.card.active .scan{
  animation:scan 3s linear infinite;
}

.scan{
  position:absolute;
  top:0;left:0;right:0;height:40px;
  background:linear-gradient(180deg,rgba(64,96,255,0.06) 0%,transparent 100%);
  pointer-events:none;
  opacity:0;
}

@keyframes scan{
  0%{top:-40px;opacity:1}
  60%{opacity:1}
  100%{top:100%;opacity:0}
}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}

.card-icon-wrap{
  position:relative;
}

.card-icon{
  width:42px;height:42px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  color:var(--sub);
}

.card.active .card-icon{
  background:rgba(64,96,255,0.15);
  border-color:rgba(64,96,255,0.3);
  color:#8aabff;
}

.card-idx{
  font-size:10px;font-weight:600;letter-spacing:0.12em;
  color:var(--muted);font-variant-numeric:tabular-nums;
}

.card.active .card-idx{ color:rgba(64,96,255,0.7); }

.card-label{
  font-size:18px;font-weight:600;letter-spacing:-0.025em;
  color:var(--text);margin-bottom:6px;line-height:1.2;
}

.card-desc{
  font-size:12px;font-weight:300;color:var(--sub);line-height:1.55;
}

/* progress bar */
.card-bar{
  margin-top:18px;
  height:2px;border-radius:1px;
  background:rgba(255,255,255,0.05);
  overflow:hidden;
}

.card-bar-fill{
  height:100%;border-radius:1px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  width:0%;
  transition:width .6s cubic-bezier(.4,0,.2,1);
}

/* ── Dots / progress ── */
.progress-row{
  display:flex;align-items:center;gap:20px;
  margin-top:44px;
  animation:fadeUp .5s .15s ease both;
}

.dots-track{
  display:flex;gap:6px;align-items:center;
}

.dot{
  width:4px;height:4px;border-radius:2px;
  background:var(--muted);
  transition:all .35s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}

.dot.active{
  width:22px;background:var(--accent);
  box-shadow:0 0 8px rgba(64,96,255,0.6);
}

.progress-label{
  font-size:11px;font-weight:500;letter-spacing:0.08em;
  color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:32px;
}

/* ── Controls ── */
.controls{
  display:flex;align-items:center;gap:12px;
  margin-top:32px;
  animation:fadeUp .5s .25s ease both;
}

.ctrl-btn{
  width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--sub);
  transition:all .2s;
}

.ctrl-btn:hover{
  background:rgba(64,96,255,0.1);
  border-color:rgba(64,96,255,0.35);
  color:var(--text);
}

.open-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--accent);
  color:#fff;border:none;border-radius:12px;
  padding:11px 28px;
  font-family:'Lexend',sans-serif;
  font-size:13px;font-weight:600;
  cursor:pointer;letter-spacing:-0.01em;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}

.open-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%);
  pointer-events:none;
}

.open-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(64,96,255,0.45),0 0 0 1px rgba(64,96,255,0.3);
}

.open-btn:active{ transform:translateY(0); }

/* ── Footer ── */
.foot{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:300;color:var(--muted);
  letter-spacing:0.07em;white-space:nowrap;
  text-transform:uppercase;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="scene">

  <div class="header">
    <div class="logo-pill">
      <span class="logo-dot"></span>
      <span class="logo-text">Dev Portal</span>
    </div>
    <div class="wordmark">Flipova <em>Developers</em></div>
    <div class="tagline" id="tagline">Tous les outils pour construire avec Flipova</div>
  </div>

  <div class="carousel-wrap">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="progress-row">
    <span class="progress-label" id="prog">01</span>
    <div class="dots-track" id="dots"></div>
    <span class="progress-label" id="total">05</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Précédent">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="open-btn" id="openBtn">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
      Ouvrir
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Suivant">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <p class="foot">← → glisser pour naviguer</p>
</div>

<script>
const ICONS={
  foundation:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>`,
  book:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c1.93-1.5 4.5-1.75 7-1.5v14c-2.5-.25-5.07 0-7 1.5m0-14C10.07 4.75 7.5 4.5 5 4.75v14c2.5-.25 5.07 0 7 1.5m0-14v14"/></svg>`,
  github:`<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`,
  sparkle:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>`,
  globe:`<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c-2.5 3-4 5.7-4 9s1.5 6 4 9M12 3c2.5 3 4 5.7 4 9s-1.5 6-4 9"/></svg>`,
};

const FALLBACK={
  name:'Flipova Developers',
  tagline:'Tous les outils pour construire avec Flipova',
  links:[
    {label:'Foundation',description:'Design system React Native — 9 thèmes, 23 layouts',url:'https://dev.flipova.fr/foundation',icon:'foundation'},
    {label:'Documentation',description:'Guides, API reference et exemples de code',url:'https://dev.flipova.fr',icon:'book'},
    {label:'GitHub',description:'Code source, issues et contributions',url:'https://github.com/flipova/foundation',icon:'github'},
    {label:'Flippa AI',description:'Assistant IA pour développeurs — bêta publique',url:'https://flipova.fr/flippa',icon:'sparkle'},
    {label:'flipova.fr',description:'Site principal Flipova',url:'https://flipova.fr',icon:'globe'},
  ]
};

let current=0,links=[],isDragging=false,dragStartX=0,dragDelta=0;

function cardW(){return Math.min(window.innerWidth*0.78,290);}

function pos(offset){
  const w=cardW();
  const gap=w*0.88;
  const x=offset*gap;
  const absO=Math.abs(offset);
  return{
    x,
    rotY:offset*-20,
    z:offset===0?0:-absO*80,
    scale:offset===0?1:Math.max(0.7,1-absO*0.14),
    opacity:offset===0?1:Math.max(0,1-absO*0.42),
    visible:absO<=2
  };
}

function buildCards(data){
  const track=document.getElementById('track');
  const dotsEl=document.getElementById('dots');
  links=data.links||[];
  track.innerHTML='';dotsEl.innerHTML='';

  document.getElementById('total').textContent=String(links.length).padStart(2,'0');

  links.forEach((l,i)=>{
    const pct=Math.round(((i+1)/links.length)*100);
    const card=document.createElement('a');
    card.className='card'+(i===0?' active':'');
    card.href=l.url;card.target='_blank';card.rel='noopener';
    card.style.width=cardW()+'px';
    card.innerHTML=`
      <div class="scan"></div>
      <div class="card-header">
        <div class="card-icon">${ICONS[l.icon]||ICONS.globe}</div>
        <span class="card-idx">${String(i+1).padStart(2,'0')} / ${String(links.length).padStart(2,'0')}</span>
      </div>
      <div class="card-label">${l.label}</div>
      <div class="card-desc">${l.description||''}</div>
      <div class="card-bar"><div class="card-bar-fill" style="width:${i===0?pct:0}%"></div></div>`;

    card.addEventListener('click',e=>{
      if(Math.abs(dragDelta)>5){e.preventDefault();return;}
      if(i!==current){e.preventDefault();goTo(i);}
    });

    track.appendChild(card);

    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.addEventListener('click',()=>goTo(i));
    dotsEl.appendChild(dot);
  });

  updateLayout(false);
}

function updateLayout(animate=true){
  const cards=document.querySelectorAll('.card');
  const dots=document.querySelectorAll('.dot');
  const w=cardW();
  const dur=animate?'.55s':'.001s';

  cards.forEach((card,i)=>{
    const offset=i-current;
    const p=pos(offset);
    card.style.width=w+'px';
    card.style.transition=`transform ${dur} cubic-bezier(.25,.8,.25,1), opacity ${dur} cubic-bezier(.25,.8,.25,1), border-color .3s, background .3s`;
    card.style.transform=`translate(calc(${p.x}px - ${w/2}px), -50%) rotateY(${p.rotY}deg) translateZ(${p.z}px) scale(${p.scale})`;
    card.style.opacity=p.visible?p.opacity:0;
    card.style.pointerEvents=Math.abs(offset)<=1?'auto':'none';
    card.classList.toggle('active',i===current);

    const bar=card.querySelector('.card-bar-fill');
    if(bar){
      const pct=Math.round(((i+1)/links.length)*100);
      bar.style.width=i===current?pct+'%':'0%';
    }
  });

  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  document.getElementById('prog').textContent=String(current+1).padStart(2,'0');

  const btn=document.getElementById('openBtn');
  if(btn&&links[current])btn.onclick=()=>window.open(links[current].url,'_blank');
}

function goTo(idx){
  current=((idx%links.length)+links.length)%links.length;
  updateLayout(true);
}

function init(cfg){
  if(cfg.tagline)document.getElementById('tagline').textContent=cfg.tagline;
  if(cfg.name)document.title=cfg.name;
  buildCards(cfg);

  document.getElementById('prevBtn').onclick=()=>goTo(current-1);
  document.getElementById('nextBtn').onclick=()=>goTo(current+1);

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')goTo(current-1);
    if(e.key==='ArrowRight')goTo(current+1);
  });

  const wrap=document.querySelector('.carousel-wrap');
  wrap.addEventListener('pointerdown',e=>{isDragging=true;dragStartX=e.clientX;dragDelta=0;wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener('pointermove',e=>{if(!isDragging)return;dragDelta=e.clientX-dragStartX;});
  wrap.addEventListener('pointerup',()=>{
    if(!isDragging)return;isDragging=false;
    if(dragDelta<-50)goTo(current+1);
    else if(dragDelta>50)goTo(current-1);
    dragDelta=0;
  });

  window.addEventListener('resize',()=>updateLayout(false));
}

fetch('links.yaml')
  .then(r=>{if(!r.ok)throw 0;return r.text();})
  .then(t=>init(jsyaml.load(t)))
  .catch(()=>init(FALLBACK));
</script>
</body>
</html>
