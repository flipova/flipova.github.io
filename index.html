<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipova Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  background:#000;
  color:#fff;
  font-family:'Lexend',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}

.scene{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}

/* ── Header ── */
.header{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  margin-bottom:64px;
  animation:fadeUp .5s ease both;
}

.wordmark{
  font-size:28px;font-weight:700;letter-spacing:-0.04em;
  color:#fff;line-height:1;
}

.wordmark em{
  font-style:normal;font-weight:300;color:rgba(255,255,255,0.4);
}

.tagline{
  font-size:12px;font-weight:300;
  color:rgba(255,255,255,0.28);
  letter-spacing:0.06em;text-transform:uppercase;
}

/* ── Carousel ── */
.carousel-wrap{
  position:relative;
  width:100vw;height:190px;
  perspective:1100px;
  perspective-origin:50% 50%;
}

.carousel-track{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
}

/* ── Card ── */
.card{
  position:absolute;
  top:50%;left:50%;
  width:300px;
  border-radius:16px;
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,0.1);
  padding:24px 24px 22px;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  will-change:transform,opacity;
}

.card.active{
  background:#111;
  border-color:rgba(255,255,255,0.3);
}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;
}

.card-icon{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.35);
}

.card.active .card-icon{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.75);
}

.card-idx{
  font-size:10px;font-weight:500;letter-spacing:0.12em;
  color:rgba(255,255,255,0.18);
}

.card.active .card-idx{ color:rgba(255,255,255,0.4); }

.card-label{
  font-size:17px;font-weight:600;letter-spacing:-0.025em;
  color:rgba(255,255,255,0.9);margin-bottom:6px;
}

.card:not(.active) .card-label{ color:rgba(255,255,255,0.4); }

.card-desc{
  font-size:12px;font-weight:300;
  color:rgba(255,255,255,0.28);line-height:1.6;
}

.card-bar{
  margin-top:20px;height:1px;
  background:rgba(255,255,255,0.07);
  overflow:hidden;
}

.card-bar-fill{
  height:100%;
  background:#fff;
  width:0%;
  transition:width .55s cubic-bezier(.4,0,.2,1);
}

/* ── Progress row ── */
.progress-row{
  display:flex;align-items:center;gap:16px;
  margin-top:44px;
  animation:fadeUp .5s .1s ease both;
}

.dots-track{
  display:flex;gap:5px;align-items:center;
}

.dot{
  width:3px;height:3px;border-radius:2px;
  background:rgba(255,255,255,0.2);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}

.dot.active{
  width:20px;
  background:#fff;
}

.prog-num{
  font-size:10px;font-weight:500;letter-spacing:0.1em;
  color:rgba(255,255,255,0.2);
  font-variant-numeric:tabular-nums;
  min-width:22px;
}

/* ── Controls ── */
.controls{
  display:flex;align-items:center;gap:10px;
  margin-top:28px;
  animation:fadeUp .5s .2s ease both;
}

.ctrl-btn{
  width:38px;height:38px;border-radius:10px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,0.3);
  transition:border-color .2s,color .2s;
}

.ctrl-btn:hover{
  border-color:rgba(255,255,255,0.35);
  color:rgba(255,255,255,0.8);
}

.open-btn{
  display:flex;align-items:center;gap:7px;
  background:#fff;color:#000;
  border:none;border-radius:10px;
  padding:10px 26px;
  font-family:'Lexend',sans-serif;
  font-size:12px;font-weight:600;
  cursor:pointer;letter-spacing:0.02em;
  transition:opacity .2s,transform .2s;
}

.open-btn:hover{
  opacity:0.88;
  transform:translateY(-1px);
}

.open-btn:active{ transform:translateY(0);opacity:1; }

/* ── Footer ── */
.foot{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:300;
  color:rgba(255,255,255,0.12);
  letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<div class="scene">

  <div class="header">
    <div class="wordmark">Flipova <em>Developers</em></div>
    <div class="tagline" id="tagline">Tous les outils pour construire avec Flipova</div>
  </div>

  <div class="carousel-wrap">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="progress-row">
    <span class="prog-num" id="prog">01</span>
    <div class="dots-track" id="dots"></div>
    <span class="prog-num" id="total">05</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Précédent">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="open-btn" id="openBtn">
      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
      Ouvrir
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Suivant">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <p class="foot">glisser ou touches ← →</p>
</div>

<script>
const ICONS={
  foundation:`<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>`,
  book:`<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c1.93-1.5 4.5-1.75 7-1.5v14c-2.5-.25-5.07 0-7 1.5m0-14C10.07 4.75 7.5 4.5 5 4.75v14c2.5-.25 5.07 0 7 1.5m0-14v14"/></svg>`,
  github:`<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`,
  sparkle:`<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>`,
  globe:`<svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c-2.5 3-4 5.7-4 9s1.5 6 4 9M12 3c2.5 3 4 5.7 4 9s-1.5 6-4 9"/></svg>`,
};

const FALLBACK={
  name:'Flipova Developers',
  tagline:'Tous les outils pour construire avec Flipova',
  links:[
    {label:'Foundation',description:'Design system React Native — 9 thèmes, 23 layouts',url:'https://dev.flipova.fr/foundation',icon:'foundation'},
    {label:'Documentation',description:'Guides, API reference et exemples de code',url:'https://dev.flipova.fr',icon:'book'},
    {label:'GitHub',description:'Code source, issues et contributions',url:'https://github.com/flipova/foundation',icon:'github'},
    {label:'Flippa AI',description:'Assistant IA pour développeurs — bêta publique',url:'https://flipova.fr/flippa',icon:'sparkle'},
    {label:'flipova.fr',description:'Site principal Flipova',url:'https://flipova.fr',icon:'globe'},
  ]
};

let current=0,links=[],isDragging=false,dragStartX=0,dragDelta=0;

function cardW(){return Math.min(window.innerWidth*0.8,300);}

function getPos(offset){
  const w=cardW();
  const gap=w*0.84;
  const absO=Math.abs(offset);
  return{
    x:offset*gap,
    rotY:offset*-18,
    z:offset===0?0:-absO*75,
    scale:offset===0?1:Math.max(0.72,1-absO*0.13),
    opacity:offset===0?1:Math.max(0,1-absO*0.45),
    visible:absO<=2
  };
}

function build(data){
  const track=document.getElementById('track');
  const dotsEl=document.getElementById('dots');
  links=data.links||[];
  track.innerHTML='';dotsEl.innerHTML='';
  document.getElementById('total').textContent=String(links.length).padStart(2,'0');

  links.forEach((l,i)=>{
    const pct=Math.round(((i+1)/links.length)*100);
    const card=document.createElement('a');
    card.className='card'+(i===0?' active':'');
    card.href=l.url;card.target='_blank';card.rel='noopener';
    card.style.width=cardW()+'px';
    card.innerHTML=`
      <div class="card-header">
        <div class="card-icon">${ICONS[l.icon]||ICONS.globe}</div>
        <span class="card-idx">${String(i+1).padStart(2,'0')} / ${String(links.length).padStart(2,'0')}</span>
      </div>
      <div class="card-label">${l.label}</div>
      <div class="card-desc">${l.description||''}</div>
      <div class="card-bar"><div class="card-bar-fill" style="width:${i===0?pct:0}%"></div></div>`;

    card.addEventListener('click',e=>{
      if(Math.abs(dragDelta)>5){e.preventDefault();return;}
      if(i!==current){e.preventDefault();goTo(i);}
    });
    track.appendChild(card);

    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.addEventListener('click',()=>goTo(i));
    dotsEl.appendChild(dot);
  });

  layout(false);
}

function layout(animate=true){
  const cards=document.querySelectorAll('.card');
  const dots=document.querySelectorAll('.dot');
  const w=cardW();
  const dur=animate?'.5s':'.001s';

  cards.forEach((card,i)=>{
    const o=i-current;
    const p=getPos(o);
    card.style.width=w+'px';
    card.style.transition=`transform ${dur} cubic-bezier(.25,.8,.25,1), opacity ${dur} cubic-bezier(.25,.8,.25,1), border-color .25s, background .25s`;
    card.style.transform=`translate(calc(${p.x}px - ${w/2}px), -50%) rotateY(${p.rotY}deg) translateZ(${p.z}px) scale(${p.scale})`;
    card.style.opacity=p.visible?p.opacity:0;
    card.style.pointerEvents=Math.abs(o)<=1?'auto':'none';
    card.classList.toggle('active',i===current);

    const fill=card.querySelector('.card-bar-fill');
    if(fill){
      const pct=Math.round(((i+1)/links.length)*100);
      fill.style.width=i===current?pct+'%':'0%';
    }
  });

  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  document.getElementById('prog').textContent=String(current+1).padStart(2,'0');

  const btn=document.getElementById('openBtn');
  if(btn&&links[current])btn.onclick=()=>window.open(links[current].url,'_blank');
}

function goTo(idx){
  current=((idx%links.length)+links.length)%links.length;
  layout(true);
}

function init(cfg){
  if(cfg.tagline)document.getElementById('tagline').textContent=cfg.tagline;
  if(cfg.name)document.title=cfg.name;
  build(cfg);

  document.getElementById('prevBtn').onclick=()=>goTo(current-1);
  document.getElementById('nextBtn').onclick=()=>goTo(current+1);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')goTo(current-1);
    if(e.key==='ArrowRight')goTo(current+1);
  });

  const wrap=document.querySelector('.carousel-wrap');
  wrap.addEventListener('pointerdown',e=>{isDragging=true;dragStartX=e.clientX;dragDelta=0;wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener('pointermove',e=>{if(isDragging)dragDelta=e.clientX-dragStartX;});
  wrap.addEventListener('pointerup',()=>{
    if(!isDragging)return;isDragging=false;
    if(dragDelta<-50)goTo(current+1);
    else if(dragDelta>50)goTo(current-1);
    dragDelta=0;
  });

  window.addEventListener('resize',()=>layout(false));
}

fetch('links.yaml')
  .then(r=>{if(!r.ok)throw 0;return r.text();})
  .then(t=>init(jsyaml.load(t)))
  .catch(()=>init(FALLBACK));
</script>
</body>
</html>
