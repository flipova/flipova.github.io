# What the portal shows: only what is public. An open source project, a public site or service, nothing else.
# The words (names, summaries, titles) live in @flipova/languages, surface `developers`, under projects.<id> and
# services.<id>; `npm test` fails when an entry has no text in a language, an address is not https, or a repository is
# not in the flipova organization.
#
# To add a project: a block under `projects`, then its name and summary in the dictionaries.
# To add a service (an API key page, the ML endpoint, a public tool...): a block under `services`, then its texts.
#
#   install   the command shown and copied on the page
#   docs      the documentation site, when there is one
#   releases  the GitHub repository whose releases the page lists
site:
  url: https://flipova.github.io
  source: https://github.com/flipova/flipova.github.io
  license: https://github.com/flipova/flipova.github.io/blob/main/LICENSE

hero:
  project: foundation

projects:
  - id: foundation
    package: "@flipova/foundation"
    install: npm install @flipova/foundation
    docs: https://flipova.github.io/foundation/
    source: https://github.com/flipova/foundation
    npm: https://www.npmjs.com/package/@flipova/foundation
    releases: flipova/foundation
  # Corral joins this list once its public version exists.

services:
  - id: website
    url: https://flipova.fr
  - id: flippa
    url: https://flipova.fr/flippa
  - id: github
    url: https://github.com/flipova
