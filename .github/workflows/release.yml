# corral-pipeline v4 kind:node ci:2c044fb80e8ae16f sha256:be32d5199858c377
# Managed by Corral. Do not edit by hand: `corral release doctor --fix` rewrites this file.
#
# One pipeline per kind of project (node here), identical in every repository of that kind, with no logic of its own.
# What is specific to a repository lives in the repository, as an OVERRIDE of a default:
#   verify   the steps of `ci/ci.yml` (edit it, then `corral ci sync`)
#   deliver  the `deliver` step of `ci/ci.yml` (edit it, then `corral ci sync`)
#
# The version is the git tag. Nothing is committed: `deliver` stamps the tag's version into the build inside the runner.
# A tag is the only thing that publishes. The FILE is called release.yml on purpose (registries bind trusted publishers to it).
name: pipeline
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('pull_request · {0} <- {1}', github.base_ref, github.head_ref)
  || format('{0} · {1}', github.event_name, github.ref_name) }}
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*", "@**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  integrity:
    name: model integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: this file is the Corral model, unedited
        run: |
          f=.github/workflows/release.yml
          declared=$(head -n 1 "$f" | sed -n 's/.*sha256:\([0-9a-f]*\).*/\1/p')
          actual=$(tail -n +2 "$f" | tr -d '\r' | sha256sum | cut -c1-16)
          echo "declared=$declared actual=$actual"
          if [ -z "$declared" ] || [ "$declared" != "$actual" ]; then
            echo "::error::$f was edited (by hand or by a bot such as Dependabot). Do not edit it: run 'corral release doctor --fix' to restore the model."
            exit 1
          fi
      - name: ci/ci.yml is the one this file was generated from
        run: |
          f=.github/workflows/release.yml
          declared=$(head -n 1 "$f" | sed -n 's/.* ci:\([0-9a-f]*\) .*/\1/p')
          actual=$(tr -d '\r' < ci/ci.yml | sha256sum | cut -c1-16)
          echo "declared=$declared actual=$actual"
          if [ "$declared" != "$actual" ]; then
            echo "::error::ci/ci.yml changed since $f was generated from it. Run 'corral ci sync' and commit both files."
            exit 1
          fi

  verify:
    name: verify (node ${{ matrix.node }})
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: access
        uses: ./ci/lib/git-auth
        with:
          token: "${{ secrets.ORG_READ_TOKEN }}"
      - name: install
        run: npm ci
      # format: skipped: no format command for this project
      - name: lint
        run: npm run lint
      # typecheck: skipped: plain JavaScript, no type checker
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: audit
        continue-on-error: true
        run: |
          corral_d=$(mktemp -d)
          cat > "$corral_d/check.sh" <<'CORRAL_AUDIT_CHECK'
          npm audit --json
          CORRAL_AUDIT_CHECK
          cat > "$corral_d/fix.sh" <<'CORRAL_AUDIT_FIX'
          npm audit fix
          CORRAL_AUDIT_FIX
          if ! bash -e "$corral_d/check.sh"; then
            echo "::warning title=audit::the check failed: applying the fix, then checking again"
            bash -e "$corral_d/fix.sh"
            git --no-pager diff --stat || true
            bash -e "$corral_d/check.sh"
            echo "::warning title=audit::repaired in the runner only: apply it in your branch (corral code fix) and commit"
          fi
  security:
    name: security
    needs: verify
    # not for Dependabot PRs: a dependency bump gets verify; the security steps of ci/ci.yml run on every other PR and on every tag
    if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: sast
        uses: ./ci/lib/semgrep
      - name: secrets
        uses: ./ci/lib/secrets
      # sbom: skipped: not requested (corral ci add <name> turns it on)
  deliver:
    name: "deliver (${{ contains(github.ref_name, '-alpha') && 'staging' || contains(github.ref_name, '-beta') && 'staging' || contains(github.ref_name, '-rc') && 'staging' || 'production' }})"
    needs: security
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ contains(github.ref_name, '-alpha') && 'staging' || contains(github.ref_name, '-beta') && 'staging' || contains(github.ref_name, '-rc') && 'staging' || 'production' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: access
        uses: ./ci/lib/git-auth
        with:
          token: "${{ secrets.ORG_READ_TOKEN }}"
      - name: install
        run: npm ci
      - name: npm recent (trusted publishing needs npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm config set registry https://registry.npmjs.org/
      - name: the version is the tag
        run: |
          version="${GITHUB_REF_NAME##*@}"
          version="${version#v}"
          case "$version" in
            *-alpha*) channel=alpha ;;
            *-beta*)  channel=beta ;;
            *-rc*)    channel=rc ;;
            *)        channel=latest ;;
          esac
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: stamp the tag's version into package.json (not committed)
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - name: build
        run: npm run build
      - name: deliver
        run: "echo 'the site is the deliverable: the documentation job builds it and the pages job publishes it to GitHub Pages'"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) flag="--prerelease" ;;
            *) flag="" ;;
          esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $flag
          fi

  docs:
    name: documentation site
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: access
        uses: ./ci/lib/git-auth
        with:
          token: "${{ secrets.ORG_READ_TOKEN }}"
      - name: docs
        uses: ./ci/lib/docs-site
        with:
          directory: .
          install: npm ci
          build: npm run build
          output: dist
          node-version: "22"
  pages:
    name: publish the documentation
    needs: [docs, deliver]
    # every tag publishes the site, prereleases included: the documentation follows the version that was just delivered
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: summary
    if: always()
    needs: [integrity, verify, security, deliver, docs, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: what this run meant
        run: |
          {
            echo "### pipeline · \`${GITHUB_REF_NAME}\` · ${GITHUB_EVENT_NAME}"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| integrity | ${{ needs.integrity.result }} |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| security | ${{ needs.security.result }} |"
            echo "| deliver | ${{ needs.deliver.result }} |"
            echo "| docs | ${{ needs.docs.result }} |"
            echo "| pages | ${{ needs.pages.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
